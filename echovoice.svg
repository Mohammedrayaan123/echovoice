<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant foreground wave -->
    <linearGradient id="primaryWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <!-- Faded background echo wave -->
    <linearGradient id="echoWave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Dark container matching your app UI -->
  <rect width="100%" height="100%" fill="#0F1117" rx="16"/>

  <!-- Soundwave Icon Group -->
  <g transform="translate(25, 25)">
    <!-- Background "Echo" Bars -->
    <rect x="8"  y="12" width="6" height="26" rx="3" fill="url(#echoWave)" />
    <rect x="22" y="2"  width="6" height="46" rx="3" fill="url(#echoWave)" />
    <rect x="36" y="-3" width="6" height="56" rx="3" fill="url(#echoWave)" />
    <rect x="50" y="8"  width="6" height="34" rx="3" fill="url(#echoWave)" />
    
    <!-- Foreground "Voice" Bars -->
    <rect x="0"  y="18" width="6" height="14" rx="3" fill="url(#primaryWave)" />
    <rect x="14" y="8"  width="6" height="34" rx="3" fill="url(#primaryWave)" />
    <rect x="28" y="3"  width="6" height="44" rx="3" fill="url(#primaryWave)" />
    <rect x="42" y="13" width="6" height="24" rx="3" fill="url(#primaryWave)" />
  </g>

  <!-- Typography -->
  <text x="95" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    Echo<tspan fill="#6366F1">Voice</tspan>
  </text>
</svg>
